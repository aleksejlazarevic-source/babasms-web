# babasms-web: point t/latest/ at the leaflet in the shops, just after midnight Europe/Ljubljana
# (EXECUTION.md T2.2; Aleksej, 4 Nov 2026: not the previous leaflet).
# GitHub cron runs on UTC. 00:07 Europe/Ljubljana is 23:07 UTC in winter and 22:07 UTC in summer, so it runs at
# both; tools/latest.py works out the Ljubljana date itself, and a second run changes nothing. (07 past the hour:
# off the busy :00 slot, guess.) Every night, not only Monday and Thursday, so a missed night is corrected
# the next one.
name: latest
on:
  schedule:
    - cron: '7 22 * * *'
    - cron: '7 23 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  latest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/latest.py .
      - name: Commit if changed
        run: |
          git add t
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git -c user.name=babasms-latest -c user.email=actions@users.noreply.github.com commit -q -m "latest: $(TZ=Europe/Ljubljana date +%F)"
          git push
