# babasms-web: fail when a rule file clashes with AGENTS.md.
# README, docs, .cursor/rules, CLAUDE.md and these workflows are the files it reads.
name: rules
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/rules_check.py
